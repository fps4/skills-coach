# Boomi for integration architects — a skill that is only a deck of flashcards (ADR-0022).
#
# This manifest is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them into a
# deck block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: boomi

title: Boomi for integration architects

description: >-
  The Boomi iPaaS at awareness level — AtomSphere, Atoms, Molecules and the Atom Cloud, the suite
  around it, and where it sits against MuleSoft — as flashcards.

contentLanguage: en
translationLanguage: en
skill: integration-architecture

goal: >-
  Place Boomi correctly in a sentence or two — its runtime model, its suite and its fit against
  MuleSoft — without notes, from the term to the idea and back.

framework:
  id: boomi-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card that can maps the Boomi idea onto a generic
      integration or runtime pattern, and says where the mapping stops.
    - >-
      Name the confusion, then separate it. Atom and Molecule, Boomi and MuleSoft: a pair that gets
      confused becomes a card whose back says how they differ.
    - One idea per card, stated as what it does and when it is the wrong choice.

  rules:
    sources: every card is written from the reference guides and says where in `details.source`
    front: the term as practitioners write it — "Atom", "Molecule", "Boomi vs MuleSoft"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the generic integration pattern it maps onto, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: cloud
  tagline: Low-code integration, placed correctly.
  surfaces: [drills:terms]
