# Flink SQL for streaming architects — a skill that is only a deck of flashcards (ADR-0022,
# ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: flink-sql

title: Flink SQL for streaming architects

description: >-
  Streaming SQL as batch SQL plus time and state — changelog semantics, watermarks, window TVFs,
  interval, temporal and lookup joins, deduplication, UDFs and the managed-Flink operating model —
  as flashcards.

contentLanguage: en
translationLanguage: en
skill: streaming-architecture

goal: >-
  Say when a row is complete and how much must be remembered for any Flink SQL operator, what it
  costs and when it is the wrong choice, without notes, in both directions.

framework:
  id: flink-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the idea onto batch SQL,
      Kafka Streams, ksqlDB or Spark Structured Streaming — a temporal join against an SCD2 lookup,
      a window TVF against a GROUP BY — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. Append and updating streams, event and processing time,
      interval and temporal joins, a temporal and a lookup join: a confused pair becomes a card
      whose back says how they differ.
    - >-
      Mechanism before vocabulary. Every back answers the two streaming questions where it can:
      when is a row complete, and how much state does it keep?
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the Apache Flink documentation, and says where in `details.source`
    front: the term as practitioners write it — `FOR SYSTEM_TIME AS OF`, "watermark", `HOP`
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short Flink SQL or Java snippet where seeing it is faster than reading about it
    analogy: the batch-SQL or other-engine counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: cloud
  tagline: Batch SQL, plus time and state.
  surfaces: [drills:terms]
