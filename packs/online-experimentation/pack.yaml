# Online experimentation — a skill that is only a deck of self-graded flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: online-experimentation

title: Online experimentation

description: >-
  A/B testing for ML and ranking products — assignment, metrics, variance reduction, sequential
  testing, interleaving and marketplace interference — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-science # free label, descriptive only

goal: >-
  Say what each experimentation technique does, which silent failure it guards against and when it
  is the wrong design, without notes, from the term to the idea and back.

framework:
  id: experimentation-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows: hash bucketing against hash partitioning, a guardrail
      against a data-quality check, an SRM test against a row-count reconciliation — and say where the
      analogy breaks.
    - >-
      Name the confusion, then separate it — fixed-horizon and sequential, A/B and interleaving, user
      and cluster randomization, primary metric and guardrail.
    - >-
      Mechanism before vocabulary: say what the technique does to the causal claim, not only its name.
    - One idea per card.
  rules:
    sources: every card is written from the reference guide or the cited literature, and says where in `details.source`
    front: the term as practitioners write it — "CUPED", "SRM", "switchback test"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short pseudocode or formula where seeing it is faster than reading about it
    analogy: the data-engineering counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: sparkles
  tagline: Causal claims that survive a marketplace.
  surfaces: [drills:terms]
