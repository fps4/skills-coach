# Aviation and climate: contrails — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): it names no person, employer, client or organisation. The cards
# are content a coach writes from the reference guides and publishes through `/coach/v1` or the MCP
# `publish_block` tool; none of them is committed (ADR-0006).

packId: aviation-climate-contrails

# One string each, in the skill's one language (ADR-0026).
title: "Aviation and climate: contrails"

description: >-
  Contrail formation and persistence, radiative forcing, CO2-equivalence and targeted avoidance — the
  physics and the data behind aviation's largest non-CO2 climate effect, as flashcards.

contentLanguage: en
translationLanguage: en
skill: aviation-climate # free label, descriptive only — nothing branches on it

goal: >-
  Explain when a contrail forms, when it persists, why it warms, and when avoiding it is a net climate
  win — without notes, in both directions, and with the uncertainty stated.

# Required by the contract and read by no ramp here: a deck has no lessons.
framework:
  id: contrail-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Where it holds, map the physics onto data
      engineering — a threshold evaluated on a weather grid joined to a trajectory — and say where
      the analogy breaks.
    - >-
      Name the confusion, then separate it. Formation and persistence, water and ice saturation,
      longwave and shortwave, GWP20 and GWP100: a pair that gets confused becomes two cards.
    - >-
      Mechanism before vocabulary. The back says what drives the effect, not only what it is called.
    - >-
      State the uncertainty. A forcing figure without its error bar is not a fact the deck teaches.
    - >-
      One idea per card.

  rules:
    sources: >-
      every card is written from the reference guides or the published literature, and says where in
      `details.source`
    front: the term as practitioners write it — "Schmidt–Appleman Criterion", "ISSR", "contrail cirrus"
    back: one sentence, at most two; what it does and when it is the wrong reading
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short formula or decision sketch where seeing it is faster than reading about it
    analogy: the data-engineering counterpart, and where it stops holding

# Cards are self-graded: turn it over, then say whether you had it (ADR-0027).
flashcards:
  grading: self

presentation:
  palette: blue
  icon: cloud
  tagline: The climate cost that isn't CO2.
  surfaces: [drills:terms]
