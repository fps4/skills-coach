# LLMOps and LLM evaluation — a skill that is only a deck of flashcards (ADR-0022).
#
# This manifest is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them into a
# deck block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: llmops-eval

title: LLMOps and LLM evaluation

description: >-
  How a non-deterministic, free-text system is kept from regressing — eval sets, LLM-as-judge and
  its biases, RAG and agent evaluation, guardrails, tracing, and the eval harness as a deploy gate —
  as flashcards.

contentLanguage: en
translationLanguage: en
skill: ai-engineering

goal: >-
  Say how each evaluation method works, how it fails and where it belongs in the path to
  production, without notes, from the term to the idea and back.

framework:
  id: llm-eval-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card that can maps the evaluation idea onto
      software testing and data quality — an eval set against a test suite, a deploy gate against a
      CI check — and says where the mapping breaks.
    - >-
      Name the confusion, then separate it. Offline and online eval, reference-based and
      reference-free metrics, eval and guardrails, outcome and process metrics: each pair becomes a
      card that says how they differ.
    - >-
      Failure modes are first-class. A method's card says how it goes wrong — a judge is biased, a
      metric is gameable — not only what it measures.
    - One idea per card.

  rules:
    sources: every card is written from the reference guides or the evaluation literature, and says where in `details.source`
    front: the term as practitioners write it — "position bias", "RAG triad", "trajectory validation"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short eval or CI-gate snippet where seeing it is faster than reading about it
    analogy: the software-testing or data-quality counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: shield-check
  tagline: Gate on quality, not on vibes.
  surfaces: [drills:terms]
