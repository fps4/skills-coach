# Image segmentation with PyTorch — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: pytorch-image-segmentation

title: Image segmentation with PyTorch

description: >-
  U-Net and its relatives, losses and metrics under class imbalance, augmentation, the training
  loop, transfer learning, post-processing and taking a model to production — as flashcards for an
  engineer who ships the system around the model.

contentLanguage: en
translationLanguage: en
skill: machine-learning-engineering

goal: >-
  Explain why each architecture, loss, metric and training choice fits a thin, imbalanced
  segmentation target, and when it is the wrong one, without notes, in both directions.

framework:
  id: segmentation-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each idea onto its systems or data-engineering
      counterpart — a skip connection against a cache of detail, a validation split against a
      staging environment — and say where it breaks.
    - >-
      Name the confusion, then separate it. Semantic and instance segmentation, IoU and Dice,
      BCE and Dice loss, train and eval mode: a pair that gets confused becomes cards whose backs
      say how they differ.
    - >-
      Derive, don't recite. Most of the stack follows from "one label per pixel"; a back says what
      the choice does and why that follows.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the PyTorch and library documentation,
      and says where in `details.source`
    front: the term as practitioners write it — "Dice loss", "skip connection", "GradScaler"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short PyTorch snippet where seeing it is faster than reading about it
    analogy: the systems or data counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: sparkles
  tagline: One label per pixel, and everything follows.
  surfaces: [drills:terms]
