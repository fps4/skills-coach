# Bid and presales process — a skill that is only a deck of self-graded flashcards (ADR-0022,
# ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: bid-and-presales-process

title: Bid and presales process

description: >-
  How a system integrator runs a pursuit — the gated bid lifecycle, the roles in the room, solution
  review and the proposal — as flashcards for the architect who owns the technical solution.

contentLanguage: en
translationLanguage: en
skill: presales # free label, descriptive only

goal: >-
  Narrate a deal through every gate, say who owns what and what a solution review challenges,
  without notes, from the term to the idea and back.

framework:
  id: bid-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows: reference architectures, stakeholder presentations
      and design reviews are the substance; a card gives them the bid process's name and gate.
    - >-
      Name the confusion, then separate it — the solution owner and the bid owner, the technical
      basis of a price and the price itself, a stated assumption and a hidden one.
    - >-
      Mechanism before vocabulary: say what a gate decides or a role owns, not only what it is
      called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guide, and says where in `details.source`
    front: the term as practitioners write it — "bid/no-bid", "orals", "solution review"
    back: one sentence, at most two; what it does and when it goes wrong
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the architecture-governance practice an architect already knows, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: briefcase
  tagline: The technical conscience of the bid.
  surfaces: [drills:terms]
