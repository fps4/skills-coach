# MuleSoft Anypoint for integration architects — a skill that is only a deck of flashcards
# (ADR-0022, ADR-0027). This manifest is the whole definition of the skill and names no person,
# employer or client. The cards are content: a coach writes them from the reference guides and
# publishes them through `/coach/v1` or the MCP `publish_block` tool. None is committed (ADR-0006).

packId: mulesoft-anypoint

title: MuleSoft Anypoint for integration architects

description: >-
  Anypoint Platform, Mule 4, DataWeave, API-led connectivity, API Manager and the CloudHub versus
  Runtime Fabric decision as flashcards, each mapped onto the API management and ESB patterns you
  already know.

contentLanguage: en
translationLanguage: en
skill: integration-architecture

goal: >-
  Name each Anypoint component, say which integration concept it packages and when it is the wrong
  choice, without notes, in both directions — from the product name to the idea and back.

framework:
  id: mulesoft-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the Anypoint name onto its
      generic counterpart — API Manager against any API gateway, System APIs against adapters,
      Experience APIs against a backend-for-frontend — and says where the mapping breaks.
    - >-
      Name the confusion, then separate it. CloudHub and Runtime Fabric, Mule 3 and Mule 4, Process
      and Experience APIs: a pair that gets confused becomes cards whose backs say how they differ.
    - >-
      Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - >-
      One idea per card. A back that needs two sentences to state is two cards.
  rules:
    sources: >-
      every card is written from the reference guides or MuleSoft's own documentation, and says where
      in `details.source`
    front: the name as practitioners write it — "Runtime Fabric", "System API", "%dw 2.0"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short DataWeave snippet where seeing it is faster than reading about it
    analogy: the generic integration or API-management counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: cloud
  tagline: Integration patterns you know, under MuleSoft's names.
  surfaces: [drills:terms]
