# Azure Arc, Azure Monitor and Azure Policy — a skill that is only a deck of flashcards (ADR-0022).
# This file is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them through
# `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: azure-arc-and-azure-monitor

title: Azure Arc, Monitor and Policy

description: >-
  The hybrid control plane and the Azure-native observability stack — Arc onboarding, Azure Policy,
  Data Collection Rules, Log Analytics cost and topology, alerting and KQL — as flashcards, each one
  mapped onto the governance and monitoring you already know from other clouds and tools.

contentLanguage: en
translationLanguage: en
skill: platform-architecture

goal: >-
  Say what each Arc, Monitor and Policy piece does, where it stops and which design decision it
  forces, without notes, in both directions — from the term to the idea and from the idea to the term.

framework:
  id: azure-ops-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card maps the Azure piece onto its Terraform,
      AWS or third-party observability counterpart where there is a real one, and says where it breaks.
    - >-
      Name the confusion, then separate it. Metrics and logs, AMA and the legacy agent, Analytics and
      Basic tables, a DCR and its association: a confused pair becomes a card that says how they differ.
    - >-
      Decisions over console screens. Where a piece forces an architect's decision — landing zone,
      workspace topology, ingestion cost, alert ownership — the back names the decision.
    - >-
      One idea per card.

  rules:
    sources: every card is written from the reference guides or the Azure documentation, and says where in `details.source`
    front: the term as practitioners write it — "deployIfNotExists", "DCR association", "resource-context RBAC"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short KQL query or CLI line where seeing it is faster than reading about it
    analogy: the counterpart from another cloud or tool, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: emerald
  icon: shield-check
  tagline: One control plane for machines you do not host.
  surfaces: [drills:terms]
