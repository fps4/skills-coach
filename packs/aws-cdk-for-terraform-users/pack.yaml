# AWS CDK for Terraform users — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: aws-cdk-for-terraform-users

title: AWS CDK for Terraform users

description: >-
  AWS CDK mapped onto the Terraform model you already hold — synth and CloudFormation, construct
  levels, logical IDs, escape hatches, assertions and Aspects — as flashcards.

contentLanguage: en
translationLanguage: en
skill: platform-engineering

goal: >-
  Say what each CDK concept is, its Terraform counterpart, what it costs and when CDK is the wrong
  choice, without notes, in both directions.

framework:
  id: cdk-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the CDK idea onto its
      Terraform counterpart — a stack against a root module, `cdk diff` against `terraform plan` —
      and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. L1 and L2, CloudFormation state and a state file, a
      rename and a move: a confused pair becomes a card whose back says how they differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the AWS CDK documentation, and says where in `details.source`
    front: the term as practitioners write it — `cdk synth`, "L2 construct", `overrideLogicalId()`
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short TypeScript snippet where seeing it is faster than reading about it
    analogy: the Terraform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: cloud
  tagline: A code generator for CloudFormation, not a rival engine.
  surfaces: [drills:terms]
