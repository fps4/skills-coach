# dbt for data architects — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: dbt

title: dbt for data architects

description: >-
  dbt as a SQL compiler, dependency graph and test runner — materialisations, ref and source,
  snapshots, tests, macros, packages, performance levers and anti-patterns — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say what each dbt mechanism does, which layer it belongs to, what it costs and when it is the
  wrong choice, without notes, in both directions.

framework:
  id: dbt-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the dbt idea onto
      hand-written SQL, ETL jobs or warehouse features — a snapshot against an SCD2 merge, a test
      against a constraint — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. Append and merge, view and ephemeral, timestamp and
      check, dbt and the orchestrator: a confused pair becomes a card whose back says how they differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the dbt documentation, and says where in `details.source`
    front: the term as practitioners write it — `ref()`, "incremental", `state:modified+`
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short SQL, Jinja or YAML snippet where seeing it is faster than reading about it
    analogy: the hand-written SQL or warehouse counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: emerald
  icon: list-checks
  tagline: Every transformation is a SELECT with declared dependencies.
  surfaces: [drills:terms]
