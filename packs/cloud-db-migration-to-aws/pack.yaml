# Cloud database migration to AWS — a skill that is only a deck of self-graded flashcards
# (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: cloud-db-migration-to-aws

title: Cloud database migration to AWS

description: >-
  Migrating SQL and NoSQL estates to AWS — the 7 R's, roadmaps and waves, DMS and SCT, cutover
  patterns, lakehouse landing and reconciliation — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture # free label, descriptive only

goal: >-
  Say what each migration strategy, tool and pattern does, when it is the wrong choice and how a
  migration is proven correct, without notes, from the term to the idea and back.

framework:
  id: migration-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows: batch loads, change capture, staging layers and
      reconciliation reports are familiar; a card maps each AWS service onto that and says where the
      mapping breaks.
    - >-
      Name the confusion, then separate it — homogeneous and heterogeneous, SCT and DMS, Aurora and
      Redshift, DataSync and Snowball, big-bang and trickle.
    - >-
      Mechanism before vocabulary: say what the tool or pattern does and what it costs, not only what
      it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guide or the AWS documentation, and says where in `details.source`
    front: the term as practitioners write it — "full load + CDC", "Limited LOB mode", "Babelfish"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short sketch where seeing it is faster than reading about it
    analogy: the on-premises data-engineering counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: cloud
  tagline: Moving the bytes is the easy part.
  surfaces: [drills:terms]
