# OpenShift for Kubernetes users — a skill that is only a deck of flashcards (ADR-0022).
# This file is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them through
# `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: openshift-for-k8s-users

title: OpenShift for Kubernetes users

description: >-
  OpenShift as Kubernetes plus an opinionated enterprise layer — oc, Projects, Routes, S2I and
  ImageStreams, DeploymentConfig, SecurityContextConstraints and the arbitrary-UID default,
  Operators, Helm and GitOps — as flashcards, each one mapped onto the Kubernetes you already know.

contentLanguage: en
translationLanguage: en
skill: platform-engineering

goal: >-
  Say what OpenShift adds over upstream Kubernetes, which native type is legacy and which is the
  modern default, and what breaks a container on first deploy, without notes, in both directions.

framework:
  id: openshift-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card maps the OpenShift idea onto its upstream
      Kubernetes counterpart and says where the mapping stops holding.
    - >-
      Say both names, and which is legacy. Route and Ingress, DeploymentConfig and Deployment,
      Templates and Helm, Project and namespace: each pair gets a card that names the modern default.
    - >-
      Lead with the sharp edge. The security default that makes a working image fail gets more cards
      than any vocabulary, because it is what actually happens on day one.
    - >-
      One idea per card.

  rules:
    sources: every card is written from the reference guides or the OpenShift documentation, and says where in `details.source`
    front: the term as practitioners write it — "restricted-v2", "oc rsh", "re-encrypt route"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short oc command, manifest or Dockerfile where seeing it is faster than reading about it
    analogy: the upstream Kubernetes counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: cloud
  tagline: Kubernetes, with opinions and a security default.
  surfaces: [drills:terms]
