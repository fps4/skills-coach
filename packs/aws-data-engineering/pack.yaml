# The AWS data-engineering stack for architects — a skill that is only a deck of flashcards
# (ADR-0022, ADR-0027). This file is the whole definition of the skill and names no person, employer
# or client. The cards are content: a coach writes them from the reference guides and publishes them
# through `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: aws-data-engineering

title: The AWS data-engineering stack for architects

description: >-
  S3, Glue, EMR, Redshift, Athena, Lambda, Step Functions, SageMaker Unified Studio and Lake
  Formation — the AWS-native lakehouse assembled piece by piece, with the decision matrices between
  them, as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-engineering

goal: >-
  Say what each AWS data service is for, where it sits on the compute spectrum, how it is tuned and
  governed, and when another engine is the better choice, without notes, in both directions.

framework:
  id: aws-data-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the AWS service onto its
      lakehouse or warehouse counterpart — the Glue Data Catalog against a Hive metastore, Lake
      Formation tags against attribute-based access — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it: Glue and EMR, Spectrum and Athena, Standard and Express
      workflows — a pair that gets confused becomes a card saying how the two differ.
    - >-
      Storage and catalog first, engines second. Cards on engines say where on the spectrum from
      pay-per-query to run-your-own-cluster the service sits.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the AWS documentation, and says where in `details.source`
    front: the service, feature or setting as practitioners write it — "LF-Tags", "DISTSTYLE KEY", ".sync"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short SQL, Python or JSON snippet where seeing it is faster than reading about it
    analogy: the lakehouse or warehouse counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: cloud
  tagline: The lakehouse, assembled.
  surfaces: [drills:terms]
