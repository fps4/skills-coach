# Tax and regulatory finance data flows — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: tax-regulatory-finance-data-flows

title: Tax and regulatory finance data flows

description: >-
  DAC7, ViDA, SAF-T, e-invoicing, PSD2, SOX and GDPR for finance data — what each regime demands of
  the data, and the architect's checklist for any regulatory pipeline — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Name each regime, say what data it needs, on what cadence, and what lineage, immutability and
  retention it forces on the architecture, without notes, in both directions.

framework:
  id: regulatory-flows-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each regime onto data-product thinking — a
      fixed schema, a fixed consumer, an SLA, immutable snapshots — and say where it breaks.
    - >-
      Name the confusion, then separate it. DAC7 and ViDA, SAF-T and e-invoicing, retention and
      erasure: a pair that gets confused becomes cards whose backs say how they differ.
    - Mechanism before vocabulary. The back says what the regime requires of the data, not only its name.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the published regulation, and says where
      in `details.source`
    front: the term as practitioners write it — "DAC7", "deemed supplier", "SAF-T"
    back: one sentence, at most two; what it requires and what it does to the architecture
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the data-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: shield-check
  tagline: The regulator's calendar is the roadmap.
  surfaces: [drills:terms]
