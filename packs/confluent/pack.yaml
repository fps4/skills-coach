# Confluent for streaming architects — a skill that is only a deck of flashcards (ADR-0022).
#
# This manifest is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them into a
# deck block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: confluent

title: Confluent for streaming architects

description: >-
  Confluent's branded dialect over Kafka — Cloud and Platform, managed and self-managed connectors,
  Tableflow, cluster linking, Terraform — and Schema Registry governance as data contracts, as
  flashcards.

contentLanguage: en
translationLanguage: en
skill: streaming-architecture

goal: >-
  Name each Confluent product and its open-source Kafka counterpart, choose a connector strategy,
  and govern schemas and topics as contracts, without notes, in both directions.

framework:
  id: confluent-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card that can maps the Confluent name onto the
      open-source Kafka or managed-cloud equivalent — cluster linking against MirrorMaker 2, a
      managed connector against a Connect worker you operate — and says where the mapping stops.
    - >-
      Name the confusion, then separate it. Managed, custom and self-managed connectors; BACKWARD
      and FORWARD compatibility; retention and compaction: each pair becomes a card that says how
      they differ.
    - >-
      Mechanism before vocabulary. A back says what the thing does and what it forces — a
      compatibility mode dictates which side upgrades first.
    - One idea per card.

  rules:
    sources: every card is written from the reference guides or Confluent's documentation, and says where in `details.source`
    front: the term as practitioners write it — "Cluster Linking", "FULL_TRANSITIVE", "TopicRecordNameStrategy"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short connector config or Terraform snippet where seeing it is faster than reading about it
    analogy: the open-source Kafka or data-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: emerald
  icon: cloud
  tagline: Same Kafka, Confluent's names on it.
  surfaces: [drills:terms]
