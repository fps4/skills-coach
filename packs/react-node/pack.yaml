# React and Node.js, hands-on — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: react-node

title: React and Node.js, hands-on

description: >-
  Modern React with hooks, Vite and TypeScript, an Express backend-for-frontend, multipart uploads,
  CORS, Docker Compose and testing — the full-stack working vocabulary, as flashcards.

contentLanguage: en
translationLanguage: en
skill: software-engineering

goal: >-
  Say what each React, Node and full-stack idiom does, why it is the current default and when it
  is the wrong choice, without notes, in both directions.

framework:
  id: react-node-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the idea onto backend
      and platform work — a BFF against an API gateway, middleware against a filter chain — and
      says where the analogy breaks.
    - >-
      Name the confusion, then separate it. Controlled and uncontrolled, useMemo and useCallback,
      502 and 504, expose and ports: a confused pair becomes a card whose back says how they differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card, and the current idiom over the legacy one.
  rules:
    sources: every card is written from the reference guides or the React, Vite, Node and Express documentation, and says where in `details.source`
    front: the term as practitioners write it — `useEffect`, "discriminated union", `AbortController`
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short TSX, JS or YAML snippet where seeing it is faster than reading about it
    analogy: the backend or platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: graduation-cap
  tagline: Current idioms, every layer of a small full-stack app.
  surfaces: [drills:terms]
