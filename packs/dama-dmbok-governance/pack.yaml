# DAMA-DMBOK and data governance for architects — a skill that is only a deck of flashcards
# (ADR-0022, ADR-0027). This file is the whole definition of the skill and names no person, employer
# or client. The cards are content: a coach writes them from the reference guides and publishes them
# through `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: dama-dmbok-governance

title: DAMA-DMBOK and data governance

description: >-
  The eleven knowledge areas, the distinctions that get confused, data-quality dimensions, metadata
  and lineage, governance operating models and data mesh, as flashcards in the profession's own
  vocabulary.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Speak DMBOK's vocabulary precisely — name each knowledge area, separate the confused pairs, and
  choose a governance model with a reason — without notes, in both directions.

framework:
  id: dmbok-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the DMBOK term onto the
      platform work it names — a golden record onto an MDM match-and-merge, operational metadata onto
      job logs — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it: governance and management, owner and steward, master and
      reference data — a pair that gets confused becomes a card saying how the two differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or DMBOK2, and says where in `details.source`
    front: the term as practitioners write it — "golden record", "data steward", "column-level lineage"
    back: one sentence, at most two; what it is for and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the platform or engineering counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: emerald
  icon: shield-check
  tagline: Who decides, and who does.
  surfaces: [drills:terms]
