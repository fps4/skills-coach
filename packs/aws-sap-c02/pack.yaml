# How this pack presents itself past the landing page (ADR-0009). Declared here, resolved by the
# viewer against its own registries — nothing in the runtime branches on which pack this is.
presentation:
  palette: blue
  icon: cloud
  tagline:
    nl: Twintig vragen per keer, gericht op wat je nog mist.
    en: Twenty questions at a time, aimed at what you still miss.
  # This pack opts *out* of the two language drills and the lesson surface: it has no vocabulary and
  # no word-order sentences, and its blocks are question banks rather than reading material. Naming
  # the surfaces is how a pack says so — omitting the key would offer all of them.
  surfaces: [quiz, progress]

# No `matchArticles:` — nothing here is matched as free text. An mcq is graded by set equality
# against its own key, so tolerant matching has nothing to be tolerant about (ADR-0014).
#
# No `sectionMap:` — this pack's blocks are published through the coach API rather than parsed out of
# markdown headings, so there is no heading map to override.
