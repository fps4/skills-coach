    label: { en: Determine security controls based on requirements, nl: Determine security controls based on requirements }
    group: { en: 'Domain 2: New Solutions', nl: 'Domein 2: Nieuwe oplossingen' }
  - id: d2-4-reliability
    label: { en: Design a strategy to meet reliability requirements, nl: Design a strategy to meet reliability requirements }
    group: { en: 'Domain 2: New Solutions', nl: 'Domein 2: Nieuwe oplossingen' }
  - id: d2-5-performance
    label: { en: Design a solution to meet performance objectives, nl: Design a solution to meet performance objectives }
    group: { en: 'Domain 2: New Solutions', nl: 'Domein 2: Nieuwe oplossingen' }
  - id: d2-6-cost-optimization
    label: { en: Determine a cost optimization strategy to meet solution goals, nl: Determine a cost optimization strategy to meet solution goals }
    group: { en: 'Domain 2: New Solutions', nl: 'Domein 2: Nieuwe oplossingen' }

  # --- Domain 3: Continuous Improvement for Existing Solutions (25%) --------
  - id: d3-1-operational-excellence
    label: { en: Determine a strategy to improve overall operational excellence, nl: Determine a strategy to improve overall operational excellence }
    group: { en: 'Domain 3: Continuous Improvement', nl: 'Domein 3: Continue verbetering' }
  - id: d3-2-improve-security
