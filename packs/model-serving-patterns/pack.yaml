# Model serving patterns — a skill that is only a deck of self-graded flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: model-serving-patterns

title: Model serving patterns

description: >-
  Batch and real-time inference, rollout strategies, autoscaling, batching, hardware, serving
  frameworks and serving-side monitoring, as flashcards mapped onto the platform work you know.

contentLanguage: en
translationLanguage: en
skill: ml-engineering # free label, descriptive only

goal: >-
  Choose a serving pattern, roll a model version out safely and say how you would know it is
  degrading, without notes, from the term to the idea and back.

framework:
  id: serving-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows: serving is a latency, throughput and cost problem
      before it is an ML problem, so every card that can maps onto service deployment, caching or
      batch pipelines, and says where the analogy breaks.
    - >-
      Name the confusion, then separate it — shadow and canary, canary and A/B, data drift and
      concept drift, batch and real-time.
    - "Mechanism before vocabulary: say what the pattern does and what it costs."
    - One idea per card.
  rules:
    sources: every card is written from the reference guide or the frameworks' documentation, and says where in `details.source`
    front: the term as practitioners write it — "canary", "dynamic batching", "training/serving skew"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short config or snippet only where seeing it is faster than reading about it
    analogy: the service-engineering or data-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: cloud
  tagline: The production half of machine learning.
  surfaces: [drills:terms]
