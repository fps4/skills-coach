# EU legal and publication standards — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: eu-legal-publication-standards

title: EU legal and publication standards

description: >-
  How EU law moves from drafting to publication — Akoma Ntoso and AKN4EU, FORMEX, ELI, IMMC, EU
  Vocabularies and CELLAR — as flashcards, each mapped onto schemas, mappings and metadata you
  already know.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say what each standard is for, where it sits in the drafting-to-publication chain and where an
  architect adds value between them, without notes, in both directions.

framework:
  id: eu-legal-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each standard onto its data-integration
      counterpart — a metadata envelope, a schema mapping, a stable key — and say where it breaks.
    - >-
      Name the confusion, then separate it. AKN4EU and FORMEX, Work and Expression, ELI and CELLAR:
      a pair that gets confused becomes cards whose backs say how they differ.
    - >-
      Mechanism before vocabulary. The back says what the standard does in the chain, not only
      what the acronym stands for.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the Publications Office documentation, and
      says where in `details.source`
    front: the term as practitioners write it — "AKN4EU", "eId", "FRBR Expression"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short XML, URI or SPARQL snippet where seeing it is faster than reading about it
    analogy: the integration or modelling counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: book-open
  tagline: From the drafting editor to the Official Journal.
  surfaces: [drills:terms]
