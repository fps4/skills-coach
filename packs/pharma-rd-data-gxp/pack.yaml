# Pharma R&D data and GxP — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this file defines the skill and names no person, employer or
# client. The cards are content: a coach writes them from the reference guides and publishes them
# into a deck block through `/coach/v1` or the MCP `publish_block` tool. None is committed (ADR-0006).

packId: pharma-rd-data-gxp

# One string each, in the skill's one language (ADR-0026).
title: Pharma R&D data and GxP

description: >-
  The vocabulary and constraints of clinical, research and real-world data — CDISC, OMOP, blinding,
  GxP, Part 11, ALCOA+ — as flashcards, each one tied to what it changes in a software delivery plan.

contentLanguage: en
translationLanguage: en
skill: domain-knowledge # free label, descriptive only — nothing branches on it

goal: >-
  Recognise each term, say which ones change the delivery plan and why, and know the first question
  to ask a scientific or Quality owner — without notes, in both directions.

# Required by the contract and read by no ramp here: a deck has no lessons.
framework:
  id: pharma-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each regulated-data idea onto its data-platform
      counterpart — OMOP against a star schema, blinding against a lineage-based access wall, a
      cohort definition against a contested business metric — and say where the mapping breaks.
    - >-
      Constraint before vocabulary. A card says what the term changes in a plan — validation,
      access, audit, change control — not only what the acronym expands to.
    - >-
      Name the confusion, then separate it. CDASH, SDTM and ADaM; CSV and CSA; pseudonymised and
      anonymous: a confused pair becomes cards whose backs say how each differs.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the primary sources they cite (CDISC, OHDSI,
      FDA and EMA guidance, ISPE GAMP 5), and says where in `details.source`
    front: the term as practitioners write it — "SDTM", "21 CFR Part 11", "OMOP CDM"
    back: one sentence, at most two; what it is and what it changes in delivery
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the data-platform counterpart, and where it stops holding

# A deck writes nothing to the error log and no coach corrects it (ADR-0022).

flashcards:
  grading: self

presentation:
  palette: blue
  icon: shield-check
  tagline: Where the rules are stricter than retail.
  surfaces: [drills:terms]
