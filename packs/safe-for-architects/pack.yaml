# SAFe for architects — a skill that is only a deck of self-graded flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: safe-for-architects

title: SAFe for architects

description: >-
  The Scaled Agile Framework's structure, backlog vocabulary and the System Architect's duties, as
  flashcards — enough to work inside a release train and speak its language.

contentLanguage: en
translationLanguage: en
skill: delivery-frameworks # free label, descriptive only

goal: >-
  Name each SAFe event, role and backlog item and say what it is for and where the architect fits,
  without notes, from the term to the idea and back.

framework:
  id: safe-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows: multi-team planning, dependency tracking and
      architecture ahead of the build are familiar; a card gives them the SAFe name.
    - >-
      Name the confusion, then separate it — Product Management and Product Owner, enabler and
      business feature, runway too short and too long.
    - >-
      Mechanism before vocabulary: say what the event or role produces, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guide or the published SAFe framework, and says where in `details.source`
    front: the term as practitioners write it — "ART", "WSJF", "IP iteration"
    back: one sentence, at most two; what it does and when it is misused
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the delivery practice an architect already knows, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: list-checks
  tagline: The release train, in its own words.
  surfaces: [drills:terms]
