# Feature platforms for ML — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: feature-platforms

title: Feature platforms for ML

description: >-
  What a feature store is — offline and online stores, training/serving skew, point-in-time joins,
  materialisation, Feast made concrete, and when it is not worth it — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say what each part of a feature platform does, which skew it removes, what it costs and when a
  feature store is the wrong choice, without notes, in both directions.

framework:
  id: fp-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the idea onto the
      warehouse and streaming work already done — a point-in-time join against an as-of join, an
      offline store against a lakehouse table — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. Offline and online, definition and time skew, a feature
      view and a feature service, orchestrating and computing: a confused pair becomes a card whose
      back says how they differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the Feast documentation, and says where in `details.source`
    front: the term as practitioners write it — "online store", `get_historical_features`, "feature view"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short Python or YAML snippet where seeing it is faster than reading about it
    analogy: the warehouse or streaming counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: sparkles
  tagline: Compute once, serve the same value to training and inference.
  surfaces: [drills:terms]
