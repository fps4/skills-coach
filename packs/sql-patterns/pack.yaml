# SQL patterns for architects — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
# This file is the whole definition of the skill and names no person, employer or client. The cards
# are content: a coach writes them from the reference guides and publishes them through `/coach/v1`
# or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: sql-patterns

title: SQL patterns for architects

description: >-
  Window functions, recursive CTEs, deduplication, reconciliation, slowly changing dimensions,
  late-arriving data, aggregation, dates, pivots, lateral joins, review and performance — the
  patterns behind finance-flavoured analytical SQL, as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-engineering

goal: >-
  Reach for the right pattern by name, know its trap, and write it from memory — stating the grain
  first — without notes, in both directions.

framework:
  id: sql-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Grain first. Every pattern card that can says what one row of its input and output means, and
      the trap that changes it — a fan-out join, a default window frame, a closed interval.
    - >-
      Name the confusion, then separate it: RANK and DENSE_RANK, NOT IN and NOT EXISTS, EXCEPT and
      EXCEPT ALL — a pair that gets confused becomes a card saying how the two differ.
    - Mechanism before vocabulary. The back says what the construct does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the vendor SQL references, and says where in `details.source`
    front: the construct or pattern as practitioners write it — "QUALIFY", "gap-and-island", "point-in-time join"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short query where seeing it is faster than reading about it
    analogy: the dialect difference or modelling idea it corresponds to, where there is a real one

flashcards:
  grading: self

presentation:
  palette: blue
  icon: book-open
  tagline: State the grain first.
  surfaces: [drills:terms]
