# AWS Bedrock and the AWS-native GenAI platform — a skill that is only a deck of flashcards
# (ADR-0022, ADR-0027). This manifest is the whole definition of the skill and names no person,
# employer or client. The cards are content: a coach writes them from the reference guides and
# publishes them through `/coach/v1` or the MCP `publish_block` tool. None is committed (ADR-0006).

packId: aws-bedrock-genai

title: AWS Bedrock and the GenAI platform

description: >-
  Bedrock as a stack — Converse, inference profiles, Guardrails, Knowledge Bases, Agents and
  AgentCore, Evaluations — as flashcards, each mapped onto the self-built LLM gateway, agent loop
  and RAG pipeline it replaces.

contentLanguage: en
translationLanguage: en
skill: ai-platform

goal: >-
  Name each Bedrock service, say what it does, and say where the managed option stops and a custom
  layer earns its place — without notes, in both directions.

framework:
  id: bedrock-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the managed service onto
      the self-built counterpart — an OpenAI-compatible gateway, a hand-written agent loop, pgvector
      RAG, an eval harness — and says where the mapping breaks.
    - >-
      Name the "where it stops" line. A managed service is learnt when its limit is known: what it
      does not do, and what a team then builds itself.
    - >-
      Name the confusion, then separate it. Converse and InvokeModel, Retrieve and
      RetrieveAndGenerate, Bedrock Agents and AgentCore: a confused pair becomes a card.
    - >-
      One idea per card. A back that needs two sentences to state is two cards.
  rules:
    sources: every card is written from the reference guides or the AWS documentation, and says where in `details.source`
    front: the product or API name as AWS writes it — `Converse`, "application inference profile"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short API request shape where seeing it is faster than reading about it
    analogy: the self-built or open-source counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: cloud
  tagline: The managed stack, and where it stops.
  surfaces: [drills:terms]
