# Polars and Pandas for data engineers — a skill that is only a deck of flashcards (ADR-0022).
# This file is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them through
# `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: polars-pandas

title: Polars and Pandas for data engineers

description: >-
  Single-node DataFrame engineering — why Polars is fast, lazy plans and pushdown, the expression
  API, join_asof, Pandas performance traps and dtypes, Arrow interop, and when each tool wins — as
  flashcards, each one mapped onto the Spark DataFrame model you already know.

contentLanguage: en
translationLanguage: en
skill: data-engineering

goal: >-
  Write and defend fast, correct Polars and Pandas code and say which tool fits which data size,
  without notes, in both directions — from the term to the idea and from the idea to the term.

framework:
  id: dataframe-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card maps the Polars or Pandas idea onto its
      PySpark or SQL counterpart where there is a real one, and says where it breaks.
    - >-
      Name the confusion, then separate it. Eager and lazy, null and NaN, loc and iloc, join_asof and
      merge_asof, pivot and unpivot: a confused pair becomes a card whose back says how they differ.
    - >-
      Show, don't recite. Where a line of code is faster to read than a sentence, the card carries it.
    - >-
      One idea per card.

  rules:
    sources: every card is written from the reference guides or the Polars and Pandas documentation, and says where in `details.source`
    front: the API as practitioners write it — "pl.scan_parquet", ".over()", "SettingWithCopyWarning"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short Python snippet where seeing it is faster than reading about it
    analogy: the PySpark or SQL counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: graduation-cap
  tagline: Build expressions, not row loops.
  surfaces: [drills:terms]
