# SAP S/4HANA Finance and migration patterns for data architects — a skill that is only a deck of
# flashcards (ADR-0022, ADR-0027). This file is the whole definition of the skill and names no person,
# employer or client. The cards are content: a coach writes them from the reference guides and
# publishes them through `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: sap-s4hana-finance-migration

title: SAP S/4HANA Finance and migration patterns

description: >-
  The Universal Journal, the finance modules and master data, CDS views, and the migration
  approaches with the data-architecture decisions inside each, as flashcards for an architect who
  knows dimensional finance data.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say where S/4HANA Finance data lives, which migration approach fits which estate, and which
  data-architecture decisions each one forces, without notes, in both directions.

framework:
  id: s4-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the SAP concept onto its
      dimensional or data-platform counterpart — ACDOCA against a fact table, a CDS view against a
      semantic view — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it: greenfield and brownfield, selective transition and
      Central Finance — a pair that gets confused becomes a card saying how the two differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or SAP's documentation, and says where in `details.source`
    front: the term or table as practitioners write it — "ACDOCA", "Business Partner", "brownfield"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short CDS annotation where seeing it is faster than reading about it
    analogy: the dimensional or data-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: list-checks
  tagline: Make the cutover boring.
  surfaces: [drills:terms]
