# XML tooling for integration architects — a skill that is only a deck of flashcards (ADR-0022).
# This file is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them through
# `/coach/v1` or the MCP `publish_block` tool. None of them is committed (ADR-0006).

packId: xml-xsd-xslt-xpath-schematron

title: XML, XSD, XSLT and Schematron

description: >-
  The XML toolchain — namespaces, XSD design, XPath 3.1, XSLT 3.0, Schematron, XSpec and XProc — as
  flashcards, each one mapped onto the data integration and validation you already know.

contentLanguage: en
translationLanguage: en
skill: integration-architecture

goal: >-
  Say what each XML technology is for, where it stops and which layer takes over, without notes, in
  both directions — from the term to the idea and from the idea to the term.

framework:
  id: xml-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card carries an analogy to JSON, SQL or pipeline
      tooling where there is a real one, and says where it breaks.
    - >-
      Name the confusion, then separate it. Well-formed and valid, import and include, push and pull,
      assert and report: a confused pair becomes a card whose back says how they differ.
    - >-
      Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - >-
      One idea per card.

  rules:
    sources: every card is written from the reference guides or the W3C and ISO specifications, and says where in `details.source`
    front: the term as practitioners write it — `xs:keyref`, `xsl:for-each-group`, "SVRL"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short XML, XPath or XSLT snippet where seeing it is faster than reading about it
    analogy: the JSON, SQL or pipeline counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: list-checks
  tagline: Structure in the schema, rules in Schematron.
  surfaces: [drills:terms]
