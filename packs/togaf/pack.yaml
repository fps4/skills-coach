# TOGAF for enterprise architects — a skill that is only a deck of flashcards (ADR-0022).
#
# This manifest is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them into a
# deck block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: togaf

title: TOGAF for enterprise architects

description: >-
  The ADM and its phases, the BDAT domains, building blocks, the Enterprise Continuum and
  architecture governance — and where TOGAF meets DMBOK and Data Mesh — as flashcards.

contentLanguage: en
translationLanguage: en
skill: enterprise-architecture

goal: >-
  Speak TOGAF fluently — each phase, artefact and governance term, what it is for and where the
  framework is overkill — without notes, in both directions.

framework:
  id: togaf-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      A method, not an inventory. A card says what a phase or artefact is for and when to skip it,
      not only what the specification calls it.
    - >-
      Name the confusion, then separate it. ABB and SBB, a compliance review and an ARB, a
      dispensation and a waiver of the standard: a pair that gets confused becomes a card whose back
      says how they differ.
    - >-
      Build from what the learner already knows. A card that can maps the TOGAF term onto the
      everyday practice it formalises — an ADR, an RFC, a design review — and says where it stops.
    - One idea per card.

  rules:
    sources: every card is written from the reference guides or the TOGAF Standard, and says where in `details.source`
    front: the term as practitioners write it — "Phase C", "ABB vs SBB", "Dispensation"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the everyday architecture practice it formalises, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: list-checks
  tagline: The method, without the paperwork.
  surfaces: [drills:terms]
