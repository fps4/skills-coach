# The SAP data platform for data architects — a skill that is only a deck of flashcards (ADR-0022).
#
# This manifest is the whole definition of the skill and names no person, employer or client.
# The cards are content: a coach writes them from the reference guides and publishes them into a
# deck block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: sap-data-platform

title: The SAP data platform for data architects

description: >-
  RISE, BTP, Datasphere, Business Data Cloud, SAP Analytics Cloud and HANA — what each one is, how
  SAP data reaches a non-SAP lakehouse, and the confusions that trip people up — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say what each piece of the SAP data stack is, which extraction route is current, and which
  integration pattern fits an estate, without notes, in both directions.

framework:
  id: sap-data-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. A card that can maps the SAP product onto its
      lakehouse or warehouse counterpart — a Space against a database, a Replication Flow against
      CDC — and says where the mapping stops.
    - >-
      Name the confusion, then separate it. Datasphere and HANA Cloud, BDC and Datasphere, RISE and
      S/4HANA Cloud, a live connection and federation: each pair becomes a card that says how they
      differ.
    - Separate the current from the legacy. A card on an extraction route says whether it is the one to choose today.
    - One idea per card, stated as what it does and when it is the wrong choice.

  rules:
    sources: every card is written from the reference guides and says where in `details.source`
    front: the term as practitioners write it — "Replication Flow", "CDC-enabled CDS", "BDC vs Datasphere"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short pipeline sketch only where seeing it is faster than reading about it
    analogy: the lakehouse or warehouse counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: cloud
  tagline: Where SAP data lives, and how it leaves.
  surfaces: [drills:terms]
