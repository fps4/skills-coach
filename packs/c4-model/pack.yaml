# The C4 model for system architecture — a skill that is only a deck of flashcards (ADR-0022,
# ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: c4-model

title: The C4 model for system architecture

description: >-
  C4's four zoom levels, its supplementary views, its notation, its tools and its anti-patterns —
  and where it sits beside UML, ArchiMate and an ERD — as flashcards.

contentLanguage: en
translationLanguage: en
skill: software-architecture

goal: >-
  Name the level you are drawing at, what belongs on it and what does not, and when C4 is the wrong
  notation, without notes, in both directions.

framework:
  id: c4-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the idea onto data
      modelling — a Context diagram against a conceptual model, a Container diagram against a
      logical one — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. A C4 container and a Docker container, C4 and UML,
      C4 and ArchiMate: a confused pair becomes a card whose back says how they differ.
    - Mechanism before vocabulary. The back says what a level or view is for, not only its name.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the C4 model documentation, and says where in `details.source`
    front: the term as practitioners write it — "Container diagram", "Dynamic view", "Structurizr DSL"
    back: one sentence, at most two; what it shows, for whom, and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short Structurizr, C4-PlantUML or Mermaid snippet where seeing it is faster than reading about it
    analogy: the data-modelling counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: list-checks
  tagline: A hierarchy of zooms, not a single diagram.
  surfaces: [drills:terms]
