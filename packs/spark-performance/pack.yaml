# Spark performance for architects — a skill that is only a deck of self-graded flashcards
# (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content a coach publishes into a deck block through
# `/coach/v1` or `publish_block`; none of them is committed (ADR-0006).

packId: spark-performance

title: Spark performance for architects

description: >-
  How Spark executes, and why a PySpark job is slow — shuffles, joins, skew, partitioning, AQE,
  caching, streaming and the runtimes it runs on — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-engineering # free label, descriptive only

goal: >-
  Name the mechanism behind each Spark performance symptom and the fix that addresses it, without
  notes, from the term to the idea and back.

framework:
  id: spark-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Where a card can, it maps the Spark idea onto its
      database counterpart — a shuffle against a redistribution, a broadcast join against a
      replicated dimension, explain() against a query plan — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it: repartition and coalesce, driver and executor OOM,
      in-memory partitions and on-disk partitioning, a Python UDF and a pandas UDF.
    - >-
      Mechanism before vocabulary. The back says what the engine does and what it costs, not only
      what the setting is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guide or the Apache Spark documentation, and says where in `details.source`
    front: the term or setting as practitioners write it — "AQE", "spark.sql.shuffle.partitions", "salting"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short PySpark snippet where seeing it is faster than reading about it
    analogy: the database or warehouse counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: orange
  icon: sparkles
  tagline: Cost is the shuffle; the plan is the truth.
  surfaces: [drills:terms]
