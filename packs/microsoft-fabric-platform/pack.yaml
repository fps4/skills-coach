# Microsoft Fabric for platform architects — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: microsoft-fabric-platform

title: Microsoft Fabric for platform architects

description: >-
  Capacities and throttling, OneLake with shortcuts and mirroring, the compute surfaces, Direct Lake,
  Real-Time Intelligence, platform engineering and the comparison with Databricks — as flashcards
  for someone who already knows the lakehouse.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say which Fabric surface fits which workload, how capacity decides the architecture, and where
  Fabric stops against Databricks, without notes, in both directions.

framework:
  id: fabric-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each Fabric concept onto its Databricks, ADLS
      or Power BI counterpart and say where it breaks — a SaaS capacity is not a PaaS cluster.
    - >-
      Name the confusion, then separate it. Lakehouse and Warehouse, Import and DirectQuery and
      Direct Lake, shortcut and mirroring, interactive and background smoothing: a pair that gets
      confused becomes cards whose backs say how they differ.
    - >-
      Mark what moves. Fabric ships every few weeks; a card that states a limit, a discount or a
      date says that it must be verified against current documentation.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or Microsoft's Fabric documentation, and says
      where in `details.source`
    front: the term as practitioners write it — "Direct Lake", "F64", "OneLake shortcut"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    note: a dated claim says "verify against current docs"
    analogy: the Databricks or Azure counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: cloud
  tagline: The capacity is the architecture.
  surfaces: [drills:terms]
