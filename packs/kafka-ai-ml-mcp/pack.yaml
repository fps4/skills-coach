# Kafka to AI/ML and MCP — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content: a coach writes them from the reference guides
# and publishes them into a deck block through `/coach/v1` or `publish_block`. None is committed
# (ADR-0006).

packId: kafka-ai-ml-mcp

# One string each, in the skill's one language (ADR-0026).
title: Kafka to AI/ML and MCP

description: >-
  Putting models next to streams — the four inference patterns, feature stores and train/serve
  skew, and MCP as a governed tool layer over a streaming platform — as flashcards.

contentLanguage: en
translationLanguage: en
skill: streaming-architecture # free label, descriptive only — nothing branches on it

goal: >-
  Pick the inference pattern for a stream and say why, explain how a stream keeps online and offline
  features consistent, and describe a safe, human-approved MCP layer — without notes, in both
  directions.

# Required by the contract and read by no ramp here: a deck has no lessons.
framework:
  id: stream-ai-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each idea onto its data-platform counterpart —
      a feature store against a conformed dimension, an MCP tool against a scoped service account —
      and say where the analogy breaks.
    - >-
      Name the confusion, then separate it. Inference path and feature path, online and offline
      store, sync and async calls: a pair that gets confused becomes cards that say how they differ.
    - >-
      Selection, not recitation. A pattern card says when it wins and when it is the wrong choice.
    - >-
      One idea per card.

  rules:
    sources: every card is written from the reference guide and says where in `details.source`
    front: the term as practitioners write it — "inference-in-stream", "train/serve skew"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short Flink SQL or diagram snippet where seeing it is faster than reading about it
    analogy: the data-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: violet
  icon: sparkles
  tagline: Where the model meets the stream.
  surfaces: [drills:terms]
