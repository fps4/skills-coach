# Workday integration architecture — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: workday-integration-architecture

title: Workday integration architecture

description: >-
  The Workday integration surface — EIB, Core Connectors, Studio, SOAP, REST and RaaS, Extend and
  Orchestrate — its security model and the landscape questions around it, as flashcards mapped onto
  SaaS and ERP integration you already know.

contentLanguage: en
translationLanguage: en
skill: integration-architecture

goal: >-
  Say which integration mechanism fits which need, where the platform's limits are and how a
  Workday estate connects to the rest of the enterprise, without notes, in both directions.

framework:
  id: workday-integration-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each Workday mechanism onto its ERP, iPaaS or
      API-gateway counterpart — change detection against CDC, an ISU against a service account — and
      say where the analogy breaks.
    - >-
      Name the confusion, then separate it. EIB and Studio, SOAP and REST and RaaS, domain and
      business-process security, SAML and OAuth: a pair that gets confused becomes cards whose backs
      say how they differ.
    - Mechanism before vocabulary. The back says what the mechanism does and when it is the wrong choice.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the public Workday API documentation, and
      says where in `details.source`
    front: the term as practitioners write it — "EIB", "ISU", "RaaS", "effective dating"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    analogy: the integration-platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: emerald
  icon: cloud
  tagline: No database access, so every byte goes through a door.
  surfaces: [drills:terms]
