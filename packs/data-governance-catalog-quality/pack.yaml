# Data governance, catalog and quality — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# Committed: this is the whole definition of the skill, and it names no person, employer or client.
# The cards are content a coach writes from the reference guides and publishes into a deck block
# through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: data-governance-catalog-quality

title: Data governance, catalog and quality

description: >-
  The operational layer under DAMA vocabulary — governance operating models and policy as code,
  active-metadata catalogs and lineage, and data quality as a layered defence — as flashcards.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Say what governance, the catalog and data quality each do, which tool or practice fits which
  estate, and when a choice is wrong, without notes, in both directions.

framework:
  id: governance-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Map each practice onto its software-engineering
      counterpart — policy as code against CI rules, a DQ incident against a software incident —
      and say where it breaks.
    - >-
      Name the confusion, then separate it. Governance and catalog, owner and steward, active and
      passive metadata, rules and anomaly detection: a pair that gets confused becomes cards whose
      backs say how they differ.
    - Mechanism before vocabulary. The back says what the practice does, not only what it is called.
    - One idea per card.
  rules:
    sources: >-
      every card is written from the reference guides or the tools' own documentation, and says
      where in `details.source`
    front: the term as practitioners write it — "active metadata", "OpenLineage", "data SLA"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short YAML or SQL snippet where seeing it is faster than reading about it
    analogy: the engineering or platform counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: shield-check
  tagline: Governance decides, the catalog shows, quality measures.
  surfaces: [drills:terms]
