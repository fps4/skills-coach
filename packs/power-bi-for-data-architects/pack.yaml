# Power BI for data architects — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# This manifest is the whole definition of the skill and names no person, employer or client. The
# cards are content: a coach writes them from the reference guides and publishes them into a deck
# block through `/coach/v1` or `publish_block`. None of them is committed (ADR-0006).

packId: power-bi-for-data-architects

title: Power BI for data architects

description: >-
  The semantic-model half of Power BI — storage modes, VertiPaq and the star, row-level security,
  PBIP and TMDL, enough DAX to review — as flashcards mapped onto the warehouse you already know.

contentLanguage: en
translationLanguage: en
skill: data-architecture

goal: >-
  Discuss the model, the storage mode, the security and the release process with a BI lead as a
  peer, and review what a BI team builds — without notes, in both directions.

framework:
  id: pbi-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Build from what the learner already knows. Every card that can maps the idea onto the
      warehouse or lakehouse counterpart — a semantic model against a gold layer, RLS against a row
      filter — and says where the analogy breaks.
    - >-
      Name the confusion, then separate it. Import and DirectQuery, a measure and a calculated
      column, filter and row context: a confused pair becomes a card whose back says how they differ.
    - Mechanism before vocabulary. The back says what the thing does, not only what it is called.
    - One idea per card.
  rules:
    sources: every card is written from the reference guides or the Microsoft documentation, and says where in `details.source`
    front: the term as practitioners write it — `CALCULATE`, "Import mode", "TMDL"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer
    group: the guide's section, so the deck reads in the order the guide teaches
    code: a short DAX or TMDL snippet where seeing it is faster than reading about it
    analogy: the warehouse or dimensional counterpart, and where it stops holding

flashcards:
  grading: self

presentation:
  palette: blue
  icon: briefcase
  tagline: The model is the product; the report is a view.
  surfaces: [drills:terms]
