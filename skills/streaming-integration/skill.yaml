# Streaming & integration architecture — a skill that is only a deck of flashcards (ADR-0022,
# ADR-0027). It names no person, employer or client; the cards are content, written from the
# reference guides and published into a deck block through `/coach/v1`, never committed (ADR-0006).
#
# The cards are concepts, grouped by idea rather than by vendor: a Kafka log, a Solace queue and an
# EventBridge bus sit side by side so the learner compares them instead of memorising three products.

packId: streaming-integration

# One string each, in the skill's one language (ADR-0026).
title: Streaming & integration architecture

description: >-
  Event streaming and enterprise integration as flashcards — logs versus brokers and routers, schemas
  and event contracts, connectors and CDC, stream processing with time, state and joins, delivery
  guarantees and failure handling, operating an event platform, iPaaS and API-led integration,
  integrating SaaS and ERP systems, and streams for AI/ML and agents.

contentLanguage: en
translationLanguage: en
skill: integration-architecture # free label, descriptive only — nothing branches on it

goal: >-
  Say what each mechanism does, what it costs and when it is the wrong choice, without notes, in both
  directions — and pick between a log, a broker and a router for a given requirement.

# Required by the contract and read by no ramp here: a deck has no lessons. Kept as the ladder a
# coach writes cards against.
framework:
  id: integration-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Group by concept, not by vendor. Kafka, Event Hubs, Solace and EventBridge answer the same
      questions — ordering, retention, replay, delivery — differently; a card says how, so the learner
      compares rather than memorises products.
    - >-
      Name the confusion, then separate it. Log and router, BACKWARD and FORWARD, temporal and lookup
      join, rule DLQ and queue DLQ, EIB and Studio: a confused pair is one card whose back draws the
      line, or two cards that each say how they differ.
    - >-
      Mechanism before vocabulary. The back says what the thing does and when it is the wrong choice,
      not only what it is called.
    - >-
      One idea per card. A back that needs three sentences is two cards.

  rules:
    sources: >-
      every card is written from the reference guides or the vendor documentation they cite, and says
      where in `details.source`
    front: the term as practitioners write it — "watermark", "outbox pattern", "FULL_TRANSITIVE"
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — and never the front's own words
    group: the id of one of the topics declared under flashcards.topics
    code: a short SQL, config or payload snippet where seeing it is faster than reading about it
    analogy: the Kafka, SQL or warehouse counterpart, and where it stops holding

# A deck writes nothing to the error log and no coach corrects it (ADR-0022).

# Cards are self-graded: turn it over, then say whether you had it (ADR-0027).
flashcards:
  grading: self
  # The deck's topics, in the order the skill is learned (ADR-0032). Each card carries one id in
  # `group`; `guides` are the guides beside this manifest the topic is practised from.
  topics:
    - id: logs-brokers-routers
      title: "Logs, brokers & routers"
      description: "Logs vs routers, partitions and ordering, Kafka, Solace and EventBridge."
      guides: [sap-advanced-event-mesh, aws-eventbridge-event-platform-patterns, azure-event-hubs-for-kafka-users]
    - id: schemas-event-contracts
      title: "Schemas & event contracts"
      description: "Schema Registry, compatibility modes, data contracts and CloudEvents."
      guides: [confluent-platform-and-connectors, sap-advanced-event-mesh]
    - id: connectors-cdc-replication
      title: "Connectors, CDC & replication"
      description: "Connectors, CDC, the outbox pattern, SMTs and cluster linking."
      guides: [confluent-platform-and-connectors]
    - id: stream-processing-time-state
      title: "Stream processing: time & state"
      description: "Event time, watermarks, windows, state and exactly-once in Flink SQL."
      guides: [confluent-flink-sql]
    - id: streaming-joins-engines
      title: "Streaming joins & engines"
      description: "Regular, interval, temporal and lookup joins; Flink vs the rest."
      guides: [confluent-flink-sql]
    - id: routing-delivery-failure
      title: "Routing, delivery & failure"
      description: "Idempotent consumers, queues vs topics, DLQs and ordering."
      guides: [aws-eventbridge-event-platform-patterns, sap-advanced-event-mesh]
    - id: operating-event-platform
      title: Operating an event platform
      description: "Platform standards, topology, capacity, geo-replication and alarms."
      guides: [aws-eventbridge-event-platform-patterns, azure-event-hubs-for-kafka-users, confluent-platform-and-connectors]
    - id: ipaas-api-led-integration
      title: "iPaaS & API-led integration"
      description: "iPaaS, API-led connectivity, MuleSoft vs Boomi and rate limits."
      guides: [mulesoft-anypoint-fundamentals, boomi]
    - id: integrating-saas-erp-systems
      title: "Integrating SaaS & ERP systems"
      description: "Workday's write paths and connectors, and eventing a SaaS that does not."
      guides: [workday-integration-architecture, sap-advanced-event-mesh]
    - id: streams-ai-ml-agents
      title: "Streams for AI/ML & agents"
      description: "Inference in and beside the stream, streaming features and MCP."
      guides: [kafka-ai-ml-mcp-integration]

presentation:
  palette: blue
  icon: cloud
  tagline: Logs, brokers, routers — and what connects them.
  surfaces: [drills:terms]
