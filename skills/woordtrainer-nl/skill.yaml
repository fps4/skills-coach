# Woordtrainer — a skill that is only a word deck (ADR-0022).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill, and it names no
# person. There is no curriculum behind it and none will ever be committed: every word in it belongs
# to the learner who added it (ADR-0012), in a deck block of one — `woordenlijst` — that
# `migrate:to-skills` creates the first time it runs and that has no lessons. `.gitignore`
# un-ignores this one file.
#
# It was forked out of `dutch-conversation-nl`, whose word trainer it replaces: the words a learner
# could practise there, and their streaks, were copied here as their own.

packId: woordtrainer-nl

# One string each, not one per language (ADR-0026). The words are Dutch — that is the point of the
# skill — but the name and the lines around it are read in the English interface (ADR-0025).
title: Woordtrainer

description: Your own Dutch words, practised both ways until they stick.

contentLanguage: nl
translationLanguage: en
skill: vocabulary # free label, descriptive only — nothing branches on it

# Required by the contract, and meaningless for a deck: nothing is authored in blocks here, so no
# ramp reads it. Kept to the ladder the rest of the Dutch skills use.
framework:
  id: cefr
  levels: [A2, B1, B2]

# No `errorCategories`: a word drill writes nothing to the error log, and nothing a coach corrects
# arrives here (ADR-0022).

# Starter topics (ADR-0031, ADR-0032). The words are the learner's own, so these are a suggestion,
# not a fence: a word can go in any of them, under a topic the learner names themselves, or in none.
# Typed, as before — a word has a spelling. The titles are English because the interface is.
flashcards:
  grading: typed
  topics:
    - id: work
      title: Work & meetings
      description: Colleagues, planning, meetings and the words of your own field.
    - id: home
      title: Home & housing
      description: The house, the neighbourhood, renting, repairs and chores.
    - id: admin
      title: Money & paperwork
      description: The bank, taxes, the municipality, insurance and letters.
    - id: health
      title: Health & care
      description: The body, the doctor, the pharmacy and how you feel.
    - id: food
      title: Food & shopping
      description: Groceries, cooking, eating out and the shops.
    - id: getting-around
      title: Getting around
      description: Transport, directions, travel and the weather on the way.
    - id: people
      title: People & feelings
      description: Family, friends, character, moods and opinions.
    - id: time
      title: Time & numbers
      description: Days, dates, how often, how long, how much.
    - id: linking-words
      title: Linking words
      description: Conjunctions and adverbs that hold a sentence together — nadat, hoewel, toch.

# "vergadering" is accepted for "de vergadering" and the other way round.
matchArticles:
  nl: [de, het, een, "'t"]
  en: [the, a, an]

presentation:
  palette: orange
  icon: languages
  tagline: Your words, your pace.
  surfaces: [drills:terms]
