# Data platforms for architects — a skill that is only a deck of flashcards (ADR-0022, ADR-0027).
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no
# person, employer or client. The cards are content, written by a coach from the reference guides and
# published into a deck block through `/coach/v1` or the MCP `publish_block` tool; none is committed
# (ADR-0006).
#
# One deck across the platforms — Databricks, Snowflake, Microsoft Fabric, the AWS data stack, SAP's
# data products, Palantir Foundry and Power BI — grouped by concept rather than by vendor, so that a
# card compares platforms where the same idea appears in several.

packId: data-platforms

# One string each, in the skill's one language (ADR-0026).
title: Data platforms for architects

description: >-
  Lakehouse foundations, table formats and file layout, compute and cost models, query engines and
  tuning, ingestion and incremental pipelines, orchestration and release, catalogs and governance, BI
  semantic models, SAP and operational data layers, and how to choose between platforms — compared
  across Databricks, Snowflake, Fabric, AWS, SAP, Foundry and Power BI.

contentLanguage: en
translationLanguage: en
skill: data-architecture # free label, descriptive only — nothing branches on it

goal: >-
  Explain each mechanism, what it costs and when it is the wrong choice, and say which platform does
  it how — without notes, from the term to the idea and from the idea to the term.

# Required by the contract and read by no ramp here: a deck has no lessons. Kept as the ladder a
# coach writes cards against.
framework:
  id: platform-depth
  levels: [vocabulary, mechanism, trade-off, design]

method:
  principles:
    - >-
      Group by concept, not by vendor. Where the same idea exists on several platforms — the
      lakehouse, table formats, catalogs, compute/storage separation, tag-based access — one card
      names it and compares the platforms, instead of one card per product.
    - >-
      Name the confusion, then separate it. Pairs that get mixed up — Import and DirectQuery,
      shortcut and mirroring, Time Travel and Fail-safe, Lakehouse and Warehouse — become one card
      whose back says how they differ.
    - >-
      Mechanism and trade-off before vocabulary. The back says what the thing does and what it costs,
      not only what it is called.
    - >-
      One idea per card, and only the ideas an architect must hold in their head; product trivia and
      exact limits that change monthly stay in the guides.

  rules:
    sources: >-
      every card is written from the reference guides and says where in `details.source`
      ("<guide title> · <section>")
    front: the term as practitioners write it, at most eight words
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer, and never the front's own words
    group: the id of one of the topics declared under flashcards.topics
    code: a short SQL, YAML, DAX or Python snippet where seeing it is faster than reading about it
    analogy: the equivalent on a platform the learner already knows, and where it stops holding
    note: a dated claim to verify, or a caveat that does not fit the back

# A deck writes nothing to the error log and no coach corrects it (ADR-0022).

# Cards are self-graded: turn it over, then say whether you had it (ADR-0027).
flashcards:
  grading: self
  # The deck's topics, in the order the skill is learned (ADR-0032). Each card carries one id in
  # `group`; `guides` are the guides beside this manifest the topic is practised from.
  topics:
    - id: lakehouse-foundations
      title: Lakehouse foundations
      description: "Lake, warehouse and lakehouse, medallion layers, control vs compute plane."
      guides: [databricks-platform, microsoft-fabric-platform, aws-data-engineering-stack]
    - id: table-formats-file-layout
      title: "Table formats & file layout"
      description: "Delta, Iceberg and Hudi, time travel, clustering and pruning."
      guides: [databricks-platform, snowflake-platform]
    - id: compute-cost-models
      title: "Compute & cost models"
      description: "Clusters, warehouses and capacities, caches, scaling and throttling."
      guides: [snowflake-platform, microsoft-fabric-platform, aws-data-engineering-stack, databricks-platform]
    - id: engines-query-tuning
      title: "Engines & query tuning"
      description: "Photon, AQE, Redshift distribution and sort keys, Athena levers."
      guides: [aws-data-engineering-stack, databricks-platform]
    - id: ingestion-incremental-pipelines
      title: "Ingestion & incremental pipelines"
      description: "Auto Loader, Snowpipe, streams and tasks, shortcuts and mirroring."
      guides: [snowflake-platform, databricks-platform, aws-data-engineering-stack, microsoft-fabric-platform]
    - id: orchestration-release-migration
      title: "Orchestration, release & migration"
      description: "Workflows vs Airflow, asset bundles, Fabric deployment, migration waves."
      guides: [microsoft-fabric-platform, databricks-platform, aws-data-engineering-stack]
    - id: catalogs-governance-security
      title: "Catalogs, governance & security"
      description: "Unity Catalog, Glue and Lake Formation, masking and row policies."
      guides: [aws-data-engineering-stack, databricks-platform, snowflake-platform]
    - id: bi-serving-semantic-models
      title: "BI serving & semantic models"
      description: "Semantic models, storage modes, Direct Lake, RLS and DAX context."
      guides: [power-bi-for-data-architects]
    - id: sap-operational-data-layers
      title: SAP and operational data layers
      description: "Datasphere and BDC, SAP extraction, Foundry's ontology and actions."
      guides: [sap-datasphere-bdc-btp, palantir-foundry-aip]
    - id: platform-choice-coexistence
      title: "Platform choice & coexistence"
      description: "Databricks, Snowflake, Fabric and AWS: who wins where, and together."
      guides: [microsoft-fabric-platform, aws-data-engineering-stack]

presentation:
  palette: blue
  icon: cloud
  tagline: One idea, compared across the platforms.
  surfaces: [drills:terms]
