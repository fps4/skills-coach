# Data pipelines — a category skill that is only a deck of flashcards (ADR-0022, ADR-0027): the SQL,
# Spark, DataFrame, dbt, orchestration and migration ideas a data architect holds in their head.
#
# COMMITTED, deliberately (ADR-0008): this is the whole definition of the skill and it names no person,
# employer or client. The cards are content, written from the reference guides and published into a
# deck block through `/coach/v1` or the MCP `publish_block` tool; none of them is committed (ADR-0006).

packId: data-pipelines

# One string each, in the skill's one language (ADR-0026).
title: Data pipelines

description: >-
  Building and running data pipelines as flashcards — query grain and SQL patterns, reconciliation,
  slowly changing dimensions and change data capture, Spark execution and skew, partitioning and file
  layout, Polars and Pandas, dbt, Airflow orchestration, and migrating databases to AWS.

contentLanguage: en
translationLanguage: en
skill: data-engineering # free label, descriptive only — nothing branches on it

goal: >-
  Say what each mechanism does, what it costs and when it is the wrong choice, without notes, in both
  directions — from the term to the idea and from the idea to the term.

# Required by the contract and read by no ramp here: a deck has no lessons, so nothing is authored
# block by block. Kept as the ladder a coach writes cards against.
framework:
  id: pipeline-depth
  levels: [vocabulary, mechanism, design, defence]

method:
  principles:
    - >-
      Grain first. A card about a query, a join or a table says what one row means before it says
      anything else, because most pipeline bugs are a grain the author never stated.
    - >-
      Name the confusion, then separate it. repartition and coalesce, append and merge, poke and
      deferrable, rehost and replatform: a pair that gets confused becomes one card whose back says
      how the two differ.
    - >-
      Mechanism before vocabulary. The back says what the thing does and what it costs — a shuffle,
      a scan, a held worker slot — not only what it is called.
    - >-
      One idea per card. A back that needs three sentences is two cards.

  rules:
    sources: >-
      every card is written from the reference guides or the tools' own documentation, and says where
      in `details.source`
    front: the term as practitioners write it — `QUALIFY`, "sort-merge join", `none_failed_min_one_success`
    back: one sentence, at most two; what it does and when it is the wrong choice
    hint: a cue, not the answer — the runtime masks the term out of it in the reverse direction anyway
    group: the id of one of the topics declared under flashcards.topics
    code: a short SQL, PySpark, Polars, dbt or Airflow snippet where seeing it is faster than reading about it
    analogy: the warehouse or relational counterpart, and where it stops holding

# A deck writes nothing to the error log and no coach corrects it (ADR-0022).

# Cards are self-graded: turn it over, then say whether you had it (ADR-0027).
flashcards:
  grading: self
  # The deck's topics, in the order the skill is learned (ADR-0032). Each card carries one id in
  # `group`; `guides` are the guides beside this manifest the topic is practised from.
  topics:
    - id: query-patterns-grain
      title: "Query patterns & grain"
      description: "Window functions, dedupe, recursive CTEs and gaps-and-islands."
      guides: [sql-patterns]
    - id: correctness-reconciliation
      title: "Correctness & reconciliation"
      description: "Fan-out joins, anti-joins, money types and reconciling two sources."
      guides: [sql-patterns, database-migration-to-aws]
    - id: change-over-time
      title: "Change over time: SCD, CDC, streaming"
      description: "SCD2, point-in-time joins, MERGE, CDC, watermarks and exactly-once."
      guides: [sql-patterns, database-migration-to-aws, spark-performance]
    - id: distributed-execution-spark
      title: Distributed execution (Spark)
      description: "Stages and shuffles, join strategies, skew, AQE and OOMs."
      guides: [spark-performance]
    - id: data-layout-files
      title: "Data layout & files"
      description: "Partitioning, pruning, clustering, bucketing and small files."
      guides: [spark-performance, sql-patterns]
    - id: single-node-dataframes
      title: Single-node DataFrames
      description: "Polars' lazy engine, pushdown, vectorisation and Arrow."
      guides: [polars-and-pandas]
    - id: transformation-warehouse-dbt
      title: Transformation in the warehouse (dbt)
      description: "dbt layers, materializations, incremental models, tests and macros."
      guides: [dbt]
    - id: orchestration
      title: Orchestration
      description: "Idempotent tasks, data intervals, Airflow's knobs and MWAA."
      guides: [airflow-and-mwaa]
    - id: migrating-databases-aws
      title: Migrating databases to AWS
      description: "The 7 R's, wave planning, SCT and DMS, dual-run and reverse CDC."
      guides: [database-migration-to-aws]

presentation:
  palette: blue
  icon: list-checks
  tagline: From the source table to the trusted mart.
  surfaces: [drills:terms]
