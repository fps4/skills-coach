name: deploy-ds1

# Deploys the stack to ds1 after a green `dod` run on main.
#
# Runs on the shared self-hosted ds1 runner, which has the Docker socket mounted but no network
# route to the deployed stack — so health is read through `docker inspect`, not over HTTP.

on:
  workflow_run:
    workflows: [dod]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_mongo_volume:
        description: "DESTRUCTIVE — delete the MongoDB volume so its root user is recreated from the current secret. Everything in the database is lost."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-ds1
  cancel-in-progress: false # queue deploys; never cancel one mid-flight

env:
  # The ds1 runner predates Node 24; pin the checkout JS action to the node20 it has.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  # The networks override joins the api container to identity-service's network, so the in-network
  # JWKS fetch resolves (see compose.ds1.networks.yml).
  COMPOSE: docker compose -f infra/docker/compose.yml -f infra/docker/compose.ds1.networks.yml -p skills-coach --env-file config/ds1/.env

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, ds1]
    timeout-minutes: 30
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Assemble config/ds1/.env (committed base only — no secrets in the file)
        run: |
          umask 077
          cp config/ds1/.env.base config/ds1/.env
          echo "Assembled config/ds1/.env ($(grep -c . config/ds1/.env) non-empty lines)"

      # Where did the password come from? A registered secret is masked as *** in the log, so
      # seeing the literal default here means compose did NOT pick up the process environment —
      # a different fault from a stale volume, and one this would otherwise hide.
      - name: Check the password reaches compose
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          echo "secret length as this job sees it: ${#MONGO_PASSWORD}"
          echo -n "value compose resolves for the api: "
          $COMPOSE config 2>/dev/null | grep -m1 'MONGO_PASSWORD:' | sed 's/.*MONGO_PASSWORD: *//' || echo "(not found)"
          echo "If that line reads 'coach', the secret is not reaching compose."
          echo "If it reads '***', the secret IS reaching compose and a mismatch means a stale volume."

      # The password reaches compose through the *process* environment, which it interpolates
      # from just as it does the --env-file. Keeping it out of that file matters: compose parses
      # the file with dotenv rules, where `#` starts a comment and quotes are stripped — so a
      # password written there could reach MongoDB as a different string than the one the api
      # was given, which presents as "Authentication failed" rather than as a config error.
      # MONGO_INITDB_ROOT_PASSWORD only applies to an EMPTY data directory. Once the volume
      # exists, MongoDB keeps whatever credential it was first initialised with, so a password
      # that was mangled on the way in stays wrong forever. Deleting the volume is the only way
      # to re-run initialisation — hence opt-in, never automatic.
      - name: Reset the MongoDB volume (opt-in, destroys its data)
        if: inputs.reset_mongo_volume
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          echo "::warning::Deleting the MongoDB volume — every document in it is lost."
          $COMPOSE down -v --remove-orphans

      - name: Build and deploy
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          if [ -z "$MONGO_PASSWORD" ]; then
            echo "::error::COACH_MONGO_PASSWORD is not set — refusing to deploy with the default password"
            exit 1
          fi
          $COMPOSE build
          # `up -d` fails the moment a dependency never turns healthy, and it says only that.
          # The health gate below is the authority and it prints container logs, so a failure
          # here is recorded and carried rather than ending the job blind.
          if ! $COMPOSE up -d --remove-orphans; then
            echo "::warning::compose up reported an error — see the container logs below"
          fi

      - name: Wait for api health (via the Docker socket)
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          cid=$($COMPOSE ps -q api)
          [ -n "$cid" ] || { echo "::error::api container not found"; exit 1; }
          ok=0
          for i in $(seq 1 60); do            # up to ~5 minutes
            s=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo missing)
            echo "api: $s"
            [ "$s" = "healthy" ] && { ok=1; break; }
            [ "$s" = "missing" ] && { echo "::error::container disappeared"; break; }
            sleep 5
          done
          docker logs --tail 40 "$cid" 2>&1 | tail -40 || true
          [ "$ok" = 1 ] || { echo "::error::api did not become healthy"; exit 1; }

      - name: Wait for web health
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          cid=$($COMPOSE ps -q web)
          [ -n "$cid" ] || { echo "::error::web container not found"; exit 1; }
          ok=0
          for i in $(seq 1 40); do
            s=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo missing)
            echo "web: $s"
            [ "$s" = "healthy" ] && { ok=1; break; }
            sleep 5
          done
          docker logs --tail 40 "$cid" 2>&1 | tail -40 || true
          [ "$ok" = 1 ] || { echo "::error::web did not become healthy"; exit 1; }

      # Whatever happened above, show what the containers said. Without this a failed boot is
      # undiagnosable from the run log, which is exactly when the log matters most.
      - name: Container logs (always)
        if: always()
        env:
          MONGO_PASSWORD: ${{ secrets.COACH_MONGO_PASSWORD }}
        run: |
          for service in mongo api web; do
            echo "::group::$service"
            $COMPOSE logs --tail 60 "$service" 2>&1 || echo "(no container)"
            echo "::endgroup::"
          done
          $COMPOSE ps -a || true

      - name: Cleanup the assembled secrets (always)
        if: always()
        run: rm -f config/ds1/.env

      - name: Deployed revision
        if: success()
        run: echo "ds1 now running ${GITHUB_SHA::12} (from ${GITHUB_REF_NAME})"
