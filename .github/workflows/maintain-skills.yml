name: maintain-skills

# One-off data maintenance on the ds1 deployment, run inside the api container.
#
# Named tasks rather than free text, so nothing but these can be run. The one-off fork of the Dutch
# programme into `woordtrainer-nl` and `lezen-nieuws-nl` ran on 2026-09-30 and has been removed;
# `npm run migrate:to-skills` still does it for any other programme (ADR-0022).
#
#   remove-pack              delete a pack. With `including_history`, every learner's work in it
#                            goes too — the one irreversible thing this repository can do to a
#                            deployment, and only for a pack whose learners asked for it.
#
# It talks to MongoDB directly through the api container's own environment, so no credential is
# minted, typed or printed. It defaults to reporting only: `apply` must be ticked to write.
#
# Manually dispatched, always. Runs on the ds1 runner because that is where the container is.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [remove-pack]
        required: true
      pack:
        description: "remove-pack only: the pack to remove"
        type: string
        required: false
      including_history:
        description: "remove-pack only: delete every learner's work in the pack as well"
        type: boolean
        default: false
      apply:
        description: "Write. Unticked, the task only reports what it would do."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maintain-skills
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  API_CONTAINER: skills-coach-api

jobs:
  run:
    runs-on: [self-hosted, ds1]
    timeout-minutes: 30
    steps:
      - name: Remove a pack
        if: inputs.task == 'remove-pack'
        env:
          PACK: ${{ inputs.pack }}
        run: |
          # Slug-shaped or nothing: this value reaches a command line.
          [[ "$PACK" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "pack must be a packId, got '$PACK'"; exit 1; }
          docker exec "$API_CONTAINER" node dist/importer/remove-pack.js --pack "$PACK" \
            ${{ inputs.including_history && '--including-history' || '' }} \
            ${{ !inputs.apply && '--dry-run' || '' }}
