name: dod

# The Definition-of-Done gate. Every item here is blocking; see CONTRIBUTING.md.
#
# Runs on GitHub-hosted runners. This repository is public, so a pull request runs code nobody has
# reviewed yet, and that code must never reach a self-hosted runner.
#
# A successful run on main triggers deploy-ds1.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # The floor: no credentials committed. The gitleaks binary rather than the Action, which needs
    # a paid organisation licence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.0 \
            detect --no-git --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner

  api-build:
    # Building the api image runs typecheck, lint and the compile (see api.Dockerfile). Any failure
    # fails the gate, and nothing that did not pass can be shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sc-api:${{ github.run_id }}-${{ github.run_attempt }} -f infra/docker/api.Dockerfile .

  web-build:
    # Same shape for the learner surface: typecheck, lint, tests and the production build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sc-web:${{ github.run_id }}-${{ github.run_attempt }} -f infra/docker/web.Dockerfile .

  test:
    # The full suite against a real MongoDB. Unit tests pin the domain rules; integration tests
    # drive the whole coaching loop through HTTP.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: coach
          MONGO_INITDB_ROOT_PASSWORD: coach
        ports:
          - 27017:27017
        # `nofile` raised to what MongoDB recommends: every test file gets its own database, and
        # every collection and index in it is a file WiredTiger keeps open. At the daemon's default
        # the suite outgrew it and mongod aborted mid-run ("Too many open files"), which the tests
        # only ever saw as `mongo` vanishing.
        options: >-
          --ulimit nofile=64000:64000
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MONGO_URI: mongodb://coach:coach@127.0.0.1:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: api lint, typecheck and tests
        working-directory: api
        run: npm run lint && npm run typecheck && npm test
      - name: web tests
        working-directory: web
        run: npm test
      - name: Show MongoDB's side when the tests failed
        # A mongod that dies mid-run surfaces in the tests only as a refused connection; its own
        # log is the only place that says why.
        if: failure()
        run: |
          docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "${{ job.services.mongo.id }}" || true
          # Errors and fatals only: an abort is followed by a hundred lines of stack frames.
          docker logs "${{ job.services.mongo.id }}" 2>&1 | grep -E '"s":"(F|E)"' | tail -20 | cut -c1-800 || true

  pack-import:
    # The importer is the only path real content takes into the system, and the repository holds no
    # real content to test it against (ADR-0006) — so at minimum the bundled demo pack must parse.
    # This is what would catch the pack format and the importer drifting apart.
    #
    # Committed manifests (ADR-0008) are checked too, and by a different route: they ship without
    # blocks, so the importer cannot read them and `validate:manifests` is what proves they still
    # parse — and still agree with themselves about levels, ramp coverage and category ids.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Dry-run import of the demo pack
        working-directory: api
        run: npm run import:pack -- --source ../skills/demo-conversation-nl --dry-run
      - name: Validate every committed pack manifest
        working-directory: api
        run: npm run validate:manifests

  dependency-scan:
    # The advisory-database scan. BLOCKING, and never disabled: a fixable HIGH or CRITICAL in
    # something we depend on fails the gate. `--ignore-unfixed` keeps unfixable transitive noise
    # from red-walling a pull request nobody can act on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Trivy vulnerability database
        # Warm-started, so a registry blip or rate limit does not flake the gate.
        uses: actions/cache@v4
        with:
          path: .cache/trivy
          key: trivy-db
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_CACHE_DIR: .cache/trivy
